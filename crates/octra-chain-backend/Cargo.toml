[package]
name = "octra-chain-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "One `ChainBackend` trait over the three test tiers: in-process mock, real containerized node, and a node booted on forked devnet state."
publish = false

[dependencies]
octra-core     = { workspace = true }
octra-mock-rpc = { workspace = true }

# NOT in [workspace.dependencies] — this crate is the only user, and the
# workspace manifest is shared with other agents' work.
async-trait = "0.1"

base64      = { workspace = true }
hex         = { workspace = true }
parking_lot = { workspace = true }
reqwest     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
sha2        = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The ten well-known dev accounts the local node's genesis mints. Only
# the tier-2 integration test needs them, and — like async-trait above —
# this stays out of [workspace.dependencies] because this crate is its
# only user and the workspace manifest is shared with other agents' work.
octra-devkeys = { path = "../octra-devkeys" }

[lints]
workspace = true
